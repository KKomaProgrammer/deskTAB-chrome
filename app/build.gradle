plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kkomaprogrammer.desktabchrome'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kkomaprogrammer.desktabchrome'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
