name: Apply Termux connection state fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-connection-state-fix.yml'
      - 'tools/fix_connection_state.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply connection state patch
        run: |
          python3 tools/fix_connection_state.py
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/kkomaprogrammer/desktabchrome/LauncherActivity.java
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Fix Termux connected UI state'
          git push origin HEAD:main
