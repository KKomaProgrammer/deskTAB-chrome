name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deskTAB-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate deskTAB v1.2.22 resilient boot
        shell: bash
        run: |
          set -euo pipefail
          bash -n app/src/main/assets/bootstrap-v16.sh
          bash -n installer/repair-v16.sh
          : > /tmp/desktab-installer-v11.sh
          for f in installer/v10/part-*.sh; do
            cat "$f" >> /tmp/desktab-installer-v11.sh
            printf '\n' >> /tmp/desktab-installer-v11.sh
          done
          bash -n /tmp/desktab-installer-v11.sh
          python3 - <<'PY'
          from pathlib import Path

          loader = Path('app/src/main/assets/bootstrap-v16.sh').read_text()
          repair = Path('installer/repair-v16.sh').read_text()
          launcher = Path('app/src/main/java/com/kkomaprogrammer/desktabchrome/LauncherActivity.java').read_text()
          service = Path('app/src/main/java/com/kkomaprogrammer/desktabchrome/SetupService.java').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          gradle = Path('app/build.gradle').read_text()
          installer = Path('/tmp/desktab-installer-v11.sh').read_text()

          for needle in [
              'repair-v16.sh',
              "printf '\\n' >> \"$TMP\"",
              '기존 Linux 환경 확인 완료 · 빠른 수리',
          ]:
              assert needle in loader, f'missing loader invariant: {needle}'

          for needle in [
              'XSOCKET="$TMP_BASE/.X11-unix/X1"',
              'ensure_x11_server()',
              'rm -f "$XSOCKET" "$TMP_BASE/.X1-lock"',
              'termux-x11 :1 >"$STATE_DIR/x11.log" 2>&1 &',
              'wait_for_x11()',
              'ensure_desktop_session()',
              'desktab-session.env',
              'dbus-run-session -- /usr/local/bin/desktab-xfce-inner',
              'displayResolutionMode=scaled displayScale=60 fullscreen=true',
              'GUEST_MODE=',
              'setsid',
              'desktop-status',
              "printf '%s\\n' '6' > \"$STATE_DIR/desktop-repair-version\"",
          ]:
              assert needle in repair, f'missing repair invariant: {needle}'
          assert '-xstartup "$XSTARTUP"' not in repair, 'X server is still coupled to xstartup'
          assert '  --disable-gpu\n' not in repair, 'GPU is still unconditionally disabled'
          assert 'desktab-resolv.conf' not in repair, 'launch path still rewrites DNS every time'

          for needle in [
              'class LauncherActivity extends Activity',
              'primaryButton.setText("Desktop Chrome 실행")',
              'settings.setText("⚙")',
              'bootstrap-v16.sh',
              'DESKTOP_PATCH_VERSION = 6',
              'handler.postDelayed(() -> openPackage(X11)',
          ]:
              assert needle in launcher, f'missing launcher invariant: {needle}'
          assert 'v1.2.' not in launcher, 'main UI contains update/version copy'
          assert '<activity android:name=".LauncherActivity" android:exported="true">' in manifest
          assert 'termux-x11-universal-sharedUid-debug.apk' in service
          assert "versionName '1.2.22'" in gradle
          assert 'versionCode 25' in gradle

          for needle in [
              'ROOTFS_FILE_BYTES',
              'zstd -d -q -c "$ARCHIVE_FILE"',
              'ROOTFS_STRUCTURE_OK',
              'Chrome/XFCE/필수 패키지 검증 실패',
          ]:
              assert needle in installer, f'installer regression: {needle}'
          print('v1.2.22 resilient boot/performance invariants OK')
          PY

      - name: Validate runtime metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          repo = 'KKomaProgrammer/deskTAB-chrome'
          token = os.environ.get('GITHUB_TOKEN', '')
          headers = {'User-Agent': 'deskTAB-runtime-validator', 'Accept': 'application/vnd.github+json'}
          if token: headers['Authorization'] = f'Bearer {token}'
          def get_json(url, tries=8):
              last = None
              for n in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
                  except Exception as e:
                      last = e; time.sleep(min(1 + n, 5))
              raise RuntimeError(last)
          def get_text(url, tries=8):
              last = None
              for n in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'deskTAB-runtime-validator','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as r: return r.read().decode()
                  except Exception as e:
                      last = e; time.sleep(min(1 + n, 5))
              raise RuntimeError(last)
          branch = get_json(f'https://api.github.com/repos/{repo}/branches/runtime-image')
          commit = branch['commit']['sha']
          text = get_text(f'https://raw.githubusercontent.com/{repo}/{commit}/runtime/manifest.txt?ci=1')
          rows = [x.split() for x in text.splitlines() if x.strip()]
          fields = {r[0]:r[1] for r in rows if len(r)>=2 and r[0] != 'PART'}
          assert fields['ARCH'] == 'arm64' and fields['FORMAT'] == 'zst'
          total = int(fields['ARCHIVE_SIZE']); part_size = int(fields.get('PART_SIZE_BYTES','50331648'))
          parts = [r for r in rows if r[0] == 'PART']
          assert len(parts) == (total + part_size - 1)//part_size
          assert sum(int(r[2]) for r in parts) == total
          assert re.fullmatch(r'[0-9a-f]{64}', fields['ARCHIVE_SHA256'])
          print('runtime metadata OK')
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk deskTAB-Chrome.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskTAB-Chrome-apk
          path: deskTAB-Chrome.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish apk-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [ "$REMOTE_MAIN" = "$GITHUB_SHA" ] || { echo "Newer main exists; skip stale publish"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f apk-latest "$GITHUB_SHA"
          git push origin refs/tags/apk-latest --force
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest deskTAB-Chrome.apk --clobber
            gh release edit apk-latest --title "deskTAB Chrome latest" --notes "Automatic APK build from main ($GITHUB_SHA)."
          else
            gh release create apk-latest deskTAB-Chrome.apk --title "deskTAB Chrome latest" --notes "Automatic APK build from main ($GITHUB_SHA)."
          fi
