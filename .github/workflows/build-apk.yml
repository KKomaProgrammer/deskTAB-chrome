name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deskTAB-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Termux bootstrap
        run: bash -n app/src/main/assets/bootstrap.sh

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk deskTAB-Chrome.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskTAB-Chrome-apk
          path: deskTAB-Chrome.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish apk-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_MAIN" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping stale release publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f apk-latest "$GITHUB_SHA"
          git push origin refs/tags/apk-latest --force
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest deskTAB-Chrome.apk --clobber
            gh release edit apk-latest \
              --title "deskTAB Chrome latest" \
              --notes "Automatic APK build from main ($GITHUB_SHA)."
          else
            gh release create apk-latest deskTAB-Chrome.apk \
              --title "deskTAB Chrome latest" \
              --notes "Automatic APK build from main ($GITHUB_SHA)."
          fi
