name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deskTAB-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate pinned v11 Termux installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n app/src/main/assets/bootstrap.sh
          grep -q 'INSTALLER_COMMIT="8ac14c4e0a86106be3b908e27cee7d49d7ec118d"' app/src/main/assets/bootstrap.sh
          cat installer/v10/part-*.sh > /tmp/desktab-installer-v11.sh
          bash -n /tmp/desktab-installer-v11.sh
          grep -q '\[ "$fmt" = zst \]' /tmp/desktab-installer-v11.sh
          grep -q 'ROOTFS_FILE_BYTES' /tmp/desktab-installer-v11.sh
          grep -q 'zstd -d -q -c' /tmp/desktab-installer-v11.sh
          grep -q 'trap - ERR' /tmp/desktab-installer-v11.sh
          grep -q -- '--no-same-owner' /tmp/desktab-installer-v11.sh
          grep -q -- '--no-same-permissions' /tmp/desktab-installer-v11.sh
          grep -q -- '--ignore-command-error' /tmp/desktab-installer-v11.sh
          grep -q 'if wait "$EXTRACT_PID"; then' /tmp/desktab-installer-v11.sh
          grep -q 'ROOTFS_STRUCTURE_OK' /tmp/desktab-installer-v11.sh
          grep -q "printf '%s\\n' '11' > \"\$STATE_DIR/engine-version\"" /tmp/desktab-installer-v11.sh
          grep -q 'Chrome/XFCE/필수 패키지 검증 실패' /tmp/desktab-installer-v11.sh
          ! grep -q 'tar -xJpf' /tmp/desktab-installer-v11.sh

      - name: Validate published zstd runtime metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request

          repo = 'KKomaProgrammer/deskTAB-chrome'
          token = os.environ.get('GITHUB_TOKEN', '')
          headers = {'User-Agent': 'deskTAB-runtime-validator', 'Accept': 'application/vnd.github+json'}
          if token:
              headers['Authorization'] = f'Bearer {token}'

          def get_json(url, tries=8):
              last = None
              for n in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except Exception as e:
                      last = e
                      time.sleep(min(1 + n, 5))
              raise RuntimeError(f'GitHub metadata request failed: {last}')

          def get_text(url, tries=8):
              last = None
              for n in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'deskTAB-runtime-validator', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode('utf-8')
                  except Exception as e:
                      last = e
                      time.sleep(min(1 + n, 5))
              raise RuntimeError(f'manifest request failed: {last}')

          branch = get_json(f'https://api.github.com/repos/{repo}/branches/runtime-image')
          commit = branch['commit']['sha']
          assert re.fullmatch(r'[0-9a-f]{40}', commit)
          text = get_text(f'https://raw.githubusercontent.com/{repo}/{commit}/runtime/manifest.txt?ci=1')
          rows = [line.split() for line in text.splitlines() if line.strip()]
          fields = {r[0]: r[1] for r in rows if len(r) >= 2 and r[0] != 'PART'}
          assert fields.get('ARCH') == 'arm64'
          assert fields.get('FORMAT') == 'zst'
          assert fields.get('ARCHIVE_NAME') == 'runtime-arm64.tar.zst'
          total = int(fields['ARCHIVE_SIZE'])
          archive_sha = fields['ARCHIVE_SHA256']
          rootfs_tar = int(fields['ROOTFS_TAR_SIZE'])
          rootfs_files = int(fields['ROOTFS_FILE_BYTES'])
          assert total > 0 and rootfs_tar > total and rootfs_files > 0
          assert re.fullmatch(r'[0-9a-f]{64}', archive_sha)
          part_size = int(fields.get('PART_SIZE_BYTES', '50331648'))
          parts = [r for r in rows if r[0] == 'PART']
          expected_count = (total + part_size - 1) // part_size
          assert len(parts) == expected_count, (len(parts), expected_count)
          assert int(fields['PART_COUNT']) == expected_count
          assert sum(int(r[2]) for r in parts) == total
          for i, r in enumerate(parts):
              assert len(r) == 4
              assert r[1] == f'runtime-arm64.part-{i:03d}'
              assert re.fullmatch(r'[0-9a-f]{64}', r[3])
              expected_size = part_size if i < expected_count - 1 else total - part_size * (expected_count - 1)
              assert int(r[2]) == expected_size

          listing = get_json(f'https://api.github.com/repos/{repo}/contents/runtime?ref={commit}')
          remote = {x['name']: x['size'] for x in listing if x.get('type') == 'file'}
          assert remote.get('manifest.txt', 0) > 0
          for r in parts:
              assert remote.get(r[1]) == int(r[2]), (r[1], remote.get(r[1]), r[2])
          print(f'Runtime metadata OK: commit={commit}, format=zst, parts={len(parts)}, bytes={total}, tar={rootfs_tar}')
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk deskTAB-Chrome.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskTAB-Chrome-apk
          path: deskTAB-Chrome.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish apk-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_MAIN" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping stale release publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f apk-latest "$GITHUB_SHA"
          git push origin refs/tags/apk-latest --force
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest deskTAB-Chrome.apk --clobber
            gh release edit apk-latest \
              --title "deskTAB Chrome latest" \
              --notes "Automatic APK build from main ($GITHUB_SHA)."
          else
            gh release create apk-latest deskTAB-Chrome.apk \
              --title "deskTAB Chrome latest" \
              --notes "Automatic APK build from main ($GITHUB_SHA)."
          fi
