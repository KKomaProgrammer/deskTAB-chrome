name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk deskTAB-Chrome.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskTAB-Chrome-apk
          path: deskTAB-Chrome.apk

      - name: Publish rolling APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest deskTAB-Chrome.apk \
            --target "$GITHUB_SHA" \
            --title "deskTAB Chrome latest" \
            --notes "Automatic APK build from main ($GITHUB_SHA)."

# CI is intentionally triggered for every main-branch update.
