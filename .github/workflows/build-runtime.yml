name: Build fast Linux runtime

on:
  push:
    branches: [ main ]
    paths:
      - 'runtime/**'
      - '.github/workflows/build-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktab-runtime-image
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native ARM64 root filesystem
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          rm -rf /tmp/desktab-publish
          mkdir -p /tmp/desktab-publish
          docker build --pull -t desktab-runtime:arm64 runtime

          # Fail before publishing if a required desktop package/binary is absent.
          docker run --rm desktab-runtime:arm64 /bin/bash -lc '
            set -e
            test "$(dpkg --print-architecture)" = arm64
            command -v google-chrome-stable >/dev/null
            command -v xfce4-session >/dev/null
            command -v dbus-launch >/dev/null
            test -f /root/.config/autostart/desktab-chrome.desktop
            for pkg in xfce4 dbus-x11 ca-certificates curl wget gnupg xdg-utils fonts-noto fonts-noto-cjk google-chrome-stable; do
              dpkg -s "$pkg" >/dev/null 2>&1
            done
          '

          # Record the real logical file bytes so the Android installer can reject
          # an extraction before starting when there is not enough free space.
          ROOTFS_FILE_BYTES=$(docker run --rm desktab-runtime:arm64 /bin/bash -lc \
            "find / -xdev -type f -printf '%s\\n' 2>/dev/null | awk '{s+=\$1} END {printf \"%.0f\\n\", s}'")
          test -n "$ROOTFS_FILE_BYTES"
          test "$ROOTFS_FILE_BYTES" -gt 0
          printf '%s\n' "$ROOTFS_FILE_BYTES" > /tmp/desktab-rootfs-file-bytes

          CID=$(docker create desktab-runtime:arm64)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT

          # zstd is deliberately used instead of xz. On ARM Android it decompresses
          # far faster while retaining a compact single verified archive.
          rm -f /tmp/desktab-rootfs-tar-bytes
          docker export "$CID" \
            | tee >(wc -c | tr -d ' ' > /tmp/desktab-rootfs-tar-bytes) \
            | zstd -T0 -10 -q -c > /tmp/desktab-runtime-arm64.tar.zst
          for _ in $(seq 1 50); do
            [ -s /tmp/desktab-rootfs-tar-bytes ] && break
            sleep 0.1
          done
          test -s /tmp/desktab-rootfs-tar-bytes
          zstd -t -q /tmp/desktab-runtime-arm64.tar.zst
          zstd -d -q -c /tmp/desktab-runtime-arm64.tar.zst | tar -tf - >/dev/null

      - name: Split, checksum and self-test runtime
        run: |
          set -euo pipefail
          ARCHIVE=/tmp/desktab-runtime-arm64.tar.zst
          PART_SIZE=50331648
          ARCHIVE_SIZE=$(stat -c %s "$ARCHIVE")
          ARCHIVE_SHA=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          ROOTFS_TAR_SIZE=$(cat /tmp/desktab-rootfs-tar-bytes)
          ROOTFS_FILE_BYTES=$(cat /tmp/desktab-rootfs-file-bytes)
          test "$ROOTFS_TAR_SIZE" -gt "$ARCHIVE_SIZE"
          test "$ROOTFS_FILE_BYTES" -gt 0

          split -b 48M -d -a 3 "$ARCHIVE" /tmp/desktab-publish/runtime-arm64.part-
          PART_COUNT=$(find /tmp/desktab-publish -maxdepth 1 -type f -name 'runtime-arm64.part-*' | wc -l | tr -d ' ')
          EXPECTED_COUNT=$(( (ARCHIVE_SIZE + PART_SIZE - 1) / PART_SIZE ))
          test "$PART_COUNT" -eq "$EXPECTED_COUNT"

          {
            echo "VERSION $GITHUB_SHA"
            echo "ARCH arm64"
            echo "FORMAT zst"
            echo "ARCHIVE_NAME runtime-arm64.tar.zst"
            echo "ARCHIVE_SIZE $ARCHIVE_SIZE"
            echo "ARCHIVE_SHA256 $ARCHIVE_SHA"
            echo "ROOTFS_TAR_SIZE $ROOTFS_TAR_SIZE"
            echo "ROOTFS_FILE_BYTES $ROOTFS_FILE_BYTES"
            echo "PART_SIZE_BYTES $PART_SIZE"
            echo "PART_COUNT $PART_COUNT"
            for f in /tmp/desktab-publish/runtime-arm64.part-*; do
              name=$(basename "$f")
              size=$(stat -c %s "$f")
              sha=$(sha256sum "$f" | awk '{print $1}')
              echo "PART $name $size $sha"
            done
          } > /tmp/desktab-publish/manifest.txt

          # Verify names, count, total size, every SHA, exact reassembly and both
          # zstd + tar stream integrity before the runtime-image branch is updated.
          SUM=0
          INDEX=0
          while read -r kind name size sha; do
            [ "$kind" = PART ] || continue
            EXPECTED_NAME=$(printf 'runtime-arm64.part-%03d' "$INDEX")
            test "$name" = "$EXPECTED_NAME"
            test "$(stat -c %s "/tmp/desktab-publish/$name")" = "$size"
            test "$(sha256sum "/tmp/desktab-publish/$name" | awk '{print $1}')" = "$sha"
            SUM=$((SUM + size))
            INDEX=$((INDEX + 1))
          done < /tmp/desktab-publish/manifest.txt
          test "$INDEX" -eq "$PART_COUNT"
          test "$SUM" -eq "$ARCHIVE_SIZE"

          cat /tmp/desktab-publish/runtime-arm64.part-* > /tmp/desktab-runtime-reassembled.tar.zst
          test "$(stat -c %s /tmp/desktab-runtime-reassembled.tar.zst)" = "$ARCHIVE_SIZE"
          test "$(sha256sum /tmp/desktab-runtime-reassembled.tar.zst | awk '{print $1}')" = "$ARCHIVE_SHA"
          cmp -s "$ARCHIVE" /tmp/desktab-runtime-reassembled.tar.zst
          zstd -t -q /tmp/desktab-runtime-reassembled.tar.zst
          zstd -d -q -c /tmp/desktab-runtime-reassembled.tar.zst | tar -tf - >/dev/null

          du -h "$ARCHIVE"
          echo "Uncompressed tar bytes: $ROOTFS_TAR_SIZE"
          echo "Rootfs regular-file bytes: $ROOTFS_FILE_BYTES"
          ls -lh /tmp/desktab-publish
          cat /tmp/desktab-publish/manifest.txt

      - name: Publish runtime-image branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan runtime-image-work
          git rm -rf . || true
          mkdir -p runtime
          cp /tmp/desktab-publish/* runtime/
          printf '%s\n' '# deskTAB Chrome prebuilt runtime' '' \
            'Generated automatically. Contains the prebuilt ARM64 Ubuntu + XFCE + Google Chrome runtime used by the Android fast installer.' \
            'The archive uses zstd so extraction on ARM Android is substantially faster than the previous xz runtime.' > README.md
          git add -f runtime README.md
          git commit -m "Update zstd ARM64 runtime ($GITHUB_SHA)"
          git push --force origin HEAD:runtime-image
