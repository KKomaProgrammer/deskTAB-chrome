name: One-off fix integrity v1.2.12

on:
  push:
    paths:
      - '.github/workflows/fix-integrity-v1212.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch downloader and integrity verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/assets/bootstrap.sh')
          s = p.read_text()

          s = s.replace('deskTAB Chrome Linux bootstrap v6.4 시작', 'deskTAB Chrome Linux bootstrap v6.5 시작')

          start = s.index('download_part() {')
          end = s.index('\nDOWNLOAD_PIDS=()', start)
          new_download = r'''verify_part_file() {
            local file="$1" expected_size="$2" expected_sha="$3"
            local actual_size actual_sha
            [ -f "$file" ] || return 1
            actual_size="$(stat -c %s "$file" 2>/dev/null || echo 0)"
            [ "$actual_size" = "$expected_size" ] || return 1
            actual_sha="$(sha256sum "$file" 2>/dev/null | awk '{print $1}' || true)"
            [ "$actual_sha" = "$expected_sha" ]
          }

          download_part() {
            local p="$1" expected_size="$2" expected_sha="$3"
            local out="$CACHE_DIR/$1" partial="$CACHE_DIR/.${1}.partial"
            local actual=0 attempt url code

            # 캐시 파일은 크기만이 아니라 SHA까지 맞아야 완료로 인정한다.
            if verify_part_file "$out" "$expected_size" "$expected_sha"; then
              rm -f "$partial"
              return 0
            fi

            # 예전 버전의 같은 크기 조각이 남아 있을 수 있으므로 잘못된 완성 파일은 제거한다.
            if [ -f "$out" ]; then
              actual="$(stat -c %s "$out" 2>/dev/null || echo 0)"
              if [ "$actual" -lt "$expected_size" ] && [ ! -f "$partial" ]; then
                mv -f "$out" "$partial" 2>/dev/null || true
              else
                rm -f "$out"
              fi
            fi

            for attempt in 1 2 3 4 5 6; do
              if [ -f "$partial" ]; then
                actual="$(stat -c %s "$partial" 2>/dev/null || echo 0)"
                if [ "$actual" -ge "$expected_size" ]; then
                  rm -f "$partial"
                  actual=0
                fi
              else
                actual=0
              fi

              if [ $((attempt % 2)) -eq 1 ]; then
                url="$RUNTIME_BASE/$p?dl=${attempt}-$(date +%s)"
              else
                url="https://github.com/KKomaProgrammer/deskTAB-chrome/raw/refs/heads/runtime-image/runtime/$p?dl=${attempt}-$(date +%s)"
              fi

              set +e
              if [ -f "$partial" ] && [ "$actual" -gt 0 ]; then
                curl -fL --retry 4 --retry-delay 1 --connect-timeout 15 --max-time 300 -C - "$url" -o "$partial"
                code=$?
                if [ "$code" -ne 0 ]; then
                  rm -f "$partial"
                  curl -fL --retry 4 --retry-delay 1 --connect-timeout 15 --max-time 300 "$url" -o "$partial"
                  code=$?
                fi
              else
                curl -fL --retry 4 --retry-delay 1 --connect-timeout 15 --max-time 300 "$url" -o "$partial"
                code=$?
              fi
              set -e

              if [ "$code" -ne 0 ]; then
                sleep 2
                continue
              fi

              if verify_part_file "$partial" "$expected_size" "$expected_sha"; then
                mv -f "$partial" "$out"
                sync "$out" >/dev/null 2>&1 || true
                return 0
              fi

              # 완전히 받은 파일인데 SHA가 틀리면 이어받을 수 없으므로 처음부터 다시 받는다.
              actual="$(stat -c %s "$partial" 2>/dev/null || echo 0)"
              if [ "$actual" -ge "$expected_size" ]; then
                rm -f "$partial"
              fi
              sleep 1
            done

            return 1
          }
          '''
          s = s[:start] + new_download.rstrip() + s[end:]

          s = s.replace('download_part "$part" "$size" &', 'download_part "$part" "$size" "$sha" &')

          int_start = s.index('# v6.4:')
          int_end = s.index('\nprogress 82 38 "Ubuntu + XFCE + Chrome 이미지 고속 해제"', int_start)
          new_integrity = r'''# v6.5: 78% 이전에 각 조각의 크기+SHA를 모두 검증한다. 79%는 최종 확인만 수행한다.
          progress 79 45 "다운로드 완료 · 최종 무결성 확인"
          while read -r kind part size sha; do
            [ "$kind" = "PART" ] || continue
            part_path="$CACHE_DIR/$part"
            if verify_part_file "$part_path" "$size" "$sha"; then
              continue
            fi

            # 정상적으로는 도달하지 않는 예외 복구. 같은 검증 다운로드 함수를 사용한다.
            progress 79 45 "최종 확인 · $part 예외 재다운로드"
            if ! download_part "$part" "$size" "$sha"; then
              progress 79 0 "무결성 검사 실패 · $part 다운로드/검증 6회 실패"
              exit 43
            fi
            if ! verify_part_file "$part_path" "$size" "$sha"; then
              progress 79 0 "무결성 검사 실패 · $part 최종 검증 실패"
              exit 43
            fi
          done < "$MANIFEST"

          PART_PATHS=()
          while read -r kind part _ _; do
            [ "$kind" = "PART" ] || continue
            PART_PATHS+=("$CACHE_DIR/$part")
          done < "$MANIFEST"

          set +e
          CALC_SHA="$(cat "${PART_PATHS[@]}" 2>/dev/null | sha256sum | awk '{print $1}')"
          HASH_CODE=$?
          set -e
          if [ "$HASH_CODE" -ne 0 ] || [ "$CALC_SHA" != "$ARCHIVE_SHA" ]; then
            progress 79 0 "무결성 검사 실패 · 전체 이미지 SHA 불일치"
            exit 44
          fi
          '''
          s = s[:int_start] + new_integrity.rstrip() + s[int_end:]

          p.write_text(s)

          g = Path('app/build.gradle')
          gs = g.read_text().replace("versionCode 14", "versionCode 15").replace("versionName '1.2.11'", "versionName '1.2.12'")
          g.write_text(gs)
          PY

          bash -n app/src/main/assets/bootstrap.sh
          grep -q 'versionName.*1.2.12' app/build.gradle
          grep -q 'verify_part_file' app/src/main/assets/bootstrap.sh
          grep -q 'download_part "$part" "$size" "$sha" &' app/src/main/assets/bootstrap.sh

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/bootstrap.sh app/build.gradle
          git commit -m 'Validate runtime parts before download completion'
          git push origin HEAD:main
